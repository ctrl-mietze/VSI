name: VSI 0.2 Runtime Modes Build

# Rebuild marker: runtime-modes-v5-analyzer

on:
  push:
    branches:
      - v0.2-runtime-modes
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Gradle wrapper
        run: |
          sed -i '1c#!/usr/bin/env sh' gradlew
          chmod +x gradlew
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

      - name: Build fdroidDebug
        run: ./gradlew :app:assembleFdroidDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          ls -lh "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VSI-v0.2-runtime-modes-debug
          path: app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          if-no-files-found: error
