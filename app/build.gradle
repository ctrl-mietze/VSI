apply plugin: 'com.android.application'

android {
    namespace "com.aefyr.sai"
    compileSdk 35

    defaultConfig {
        applicationId "ctrl.mietze.vsi"
        minSdk 21
        targetSdk 29
        versionCode 1
        versionName "0.1.0"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "version"
    productFlavors {
        normal {
            dimension "version"
            applicationIdSuffix ".play"
            buildConfigField "int", "DEFAULT_THEME", "7"
            buildConfigField "int", "DEFAULT_DARK_THEME", "7"
            buildConfigField "boolean", "HIDE_DONATE_BUTTON", "false"
        }

        fdroid {
            dimension "version"
            buildConfigField "int", "DEFAULT_THEME", "7"
            buildConfigField "int", "DEFAULT_DARK_THEME", "7"
            buildConfigField "boolean", "HIDE_DONATE_BUTTON", "false"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.2.0'
    implementation 'androidx.preference:preference:1.1.1'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.google.android.material:material:1.3.0'

    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.tomergoldst.android:tooltips:1.0.11'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.github.aefyr.flexfilter:flexfilter:0.9-alpha'

    def room_version = "2.2.6"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    normalImplementation 'com.google.firebase:firebase-analytics:18.0.2'
    normalImplementation 'com.google.firebase:firebase-crashlytics:17.3.1'
    normalImplementation 'com.android.billingclient:billing:3.0.2'

    def shizuku_version = '12.2.0'
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"

    // Provided at runtime by LSPosed / Vector. Never package Xposed API classes into VSI.
    compileOnly 'de.robv.android.xposed:api:82'
}

if (getGradle().getStartParameter().getTaskRequests().toString().contains("Normal")) {
    println "Google Play build detected, applying Google Services and Crashlytics plugins"
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

configurations.configureEach {
    resolutionStrategy.force 'org.xerial:sqlite-jdbc:3.40.1.0'
    resolutionStrategy.dependencySubstitution {
        substitute module('com.google.android:flexbox') using module('com.google.android.flexbox:flexbox:3.0.0')
    }
}
